[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personadough"
version = "0.1.0"
description = "Shape a persona and export JSON"
requires-python = ">=3.10"
dependencies = ["openai>=1.40,<3", "python-dotenv>=1,<2", "numpy>=1.26,<3", "Faker>=25,<41", "aiofiles>=23,<26", "deprecated>=1.2,<4", "Pillow>=10,<13", "aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
personadough = "personadough.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personadough = ["*.json", "*.txt", "static/*.html"]
